spring.application.name=reverse-logistics-portal
server.port=8081
management.endpoints.web.exposure.include=health

# Database: H2 stored in a file, so data survives restarts (the data/ folder is ignored by Git)
spring.datasource.url=jdbc:h2:file:./data/rlpdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fill an empty database with demo returns on first start
app.seed-demo-data=true
