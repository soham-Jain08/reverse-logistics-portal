<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
  <div class="error-box">
    <div class="error-code">:(</div>
    <h1 class="h3 mt-3">Something went wrong</h1>
    <p class="text-muted">An unexpected problem occurred. Please try again, or go back to the portal.</p>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Back to home</a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
