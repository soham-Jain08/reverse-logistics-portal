---
# ==============================================================================
# Playbook: Comprehensive Reliability & Recovery Validation Suite
# ==============================================================================

- name: Reliability & Rollback/Recovery Demonstration
  hosts: portal_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Display test suite banner
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "STARTING RELIABILITY & RECOVERY VALIDATION SUITE"
          - "Target: {{ inventory_hostname }}"
          - "Port: {{ app_port }}"
          - "=========================================================="

    # --------------------------------------------------------------------------
    # STAGE 1: Verify Initial Stable Release (v1.0.0)
    # --------------------------------------------------------------------------
    - name: "[Stage 1] Wait for initial baseline port to be active"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        state: started
        timeout: 90
        delay: 3

    - name: "[Stage 1] Query healthcheck for initial baseline release"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
      register: stage1_health
      retries: 10
      delay: 3
      until: stage1_health.status == 200

    - name: "[Stage 1] Assert initial baseline is healthy"
      ansible.builtin.assert:
        that:
          - "'UP' in stage1_health.content"
        success_msg: "Stage 1 Passed: Initial release is UP and healthy."

    # --------------------------------------------------------------------------
    # STAGE 2: Deploy Next Release (v1.1.0)
    # --------------------------------------------------------------------------
    - name: "[Stage 2] Inspect active release before upgrade"
      ansible.builtin.stat:
        path: "{{ app_current_link }}"
      register: current_before_upgrade

    - name: "[Stage 2] Record previous release pointer"
      ansible.builtin.file:
        src: "{{ current_before_upgrade.stat.lnk_target }}"
        dest: "{{ app_previous_link }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: true

    - name: "[Stage 2] Create release directory for v1.1.0"
      ansible.builtin.file:
        path: "{{ app_releases_dir }}/v1.1.0"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: "[Stage 2] Deploy v1.1.0 application artifact"
      ansible.builtin.copy:
        src: "{{ local_artifact_path }}"
        dest: "{{ app_releases_dir }}/v1.1.0/{{ app_name }}.war"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"
        remote_src: true

    - name: "[Stage 2] Deploy v1.1.0 release manifest"
      ansible.builtin.copy:
        dest: "{{ app_releases_dir }}/v1.1.0/release-manifest.json"
        content: |
          {
            "app_name": "{{ app_name }}",
            "release_version": "v1.1.0",
            "deployed_at": "{{ ansible_date_time.iso8601 }}",
            "target_port": {{ app_port }},
            "status": "active",
            "features": ["Telemetry", "Enhanced Return Workflow"]
          }
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"

    - name: "[Stage 2] Switch current symlink to v1.1.0"
      ansible.builtin.file:
        src: "{{ app_releases_dir }}/v1.1.0"
        dest: "{{ app_current_link }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: true

    - name: "[Stage 2] Ensure bin WAR symlink points to new release"
      ansible.builtin.file:
        src: "{{ app_current_link }}/{{ app_name }}.war"
        dest: "{{ target_artifact_path }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: true

    - name: "[Stage 2] Restart service on v1.1.0"
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted

    - name: "[Stage 2] Wait for v1.1.0 port"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        state: started
        timeout: 90
        delay: 5

    - name: "[Stage 2] Verify v1.1.0 health endpoint"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
      register: stage2_health
      retries: 10
      delay: 3
      until: stage2_health.status == 200

    - name: "[Stage 2] Assert v1.1.0 is healthy"
      ansible.builtin.assert:
        that:
          - "'UP' in stage2_health.content"
        success_msg: "Stage 2 Passed: v1.1.0 deployed successfully and healthy."

    # --------------------------------------------------------------------------
    # STAGE 3: Operator-Triggered Rollback to Previous Stable Release (v1.0.0)
    # --------------------------------------------------------------------------
    - name: "[Stage 3] Read previous release pointer"
      ansible.builtin.stat:
        path: "{{ app_previous_link }}"
      register: stage3_prev_stat

    - name: "[Stage 3] Revert current symlink back to previous stable release (v1.0.0)"
      ansible.builtin.file:
        src: "{{ stage3_prev_stat.stat.lnk_target }}"
        dest: "{{ app_current_link }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: true

    - name: "[Stage 3] Point bin WAR link to restored release"
      ansible.builtin.file:
        src: "{{ app_current_link }}/{{ app_name }}.war"
        dest: "{{ target_artifact_path }}"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: true

    - name: "[Stage 3] Restart service with restored release"
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted

    - name: "[Stage 3] Wait for recovered application port"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        state: started
        timeout: 90
        delay: 5

    - name: "[Stage 3] Verify Actuator health post-rollback"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
      register: stage3_health
      retries: 10
      delay: 3
      until: stage3_health.status == 200

    - name: "[Stage 3] Assert recovery of previous stable release"
      ansible.builtin.assert:
        that:
          - "'UP' in stage3_health.content"
        success_msg: "Stage 3 Passed: Operator rollback restored stable release (v1.0.0)."

    - name: "[Stage 3] Log operator rollback event"
      ansible.builtin.lineinfile:
        path: "{{ app_rollback_log }}"
        create: true
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
        line: "[{{ ansible_date_time.iso8601 }}] OPERATOR ROLLBACK SUCCESSFUL: Reverted from v1.1.0 to {{ stage3_prev_stat.stat.lnk_target }} | Actuator UP"

    # --------------------------------------------------------------------------
    # STAGE 4: Autonomous Recovery / Self-Healing Demonstration
    # --------------------------------------------------------------------------
    - name: "[Stage 4] Execute Fault-Tolerant Deployment with Automated Recovery"
      block:
        - name: "[Stage 4 Block] Stage faulty candidate release v1.2.0-canary"
          ansible.builtin.file:
            path: "{{ app_releases_dir }}/v1.2.0-canary"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0750"

        - name: "[Stage 4 Block] Create corrupt/unbootable artifact in candidate directory"
          ansible.builtin.copy:
            dest: "{{ app_releases_dir }}/v1.2.0-canary/{{ app_name }}.war"
            content: "CORRUPTED_NON_EXECUTABLE_BYTECODE_FOR_RELIABILITY_TESTING"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0750"

        - name: "[Stage 4 Block] Point current symlink to faulty candidate"
          ansible.builtin.file:
            src: "{{ app_releases_dir }}/v1.2.0-canary"
            dest: "{{ app_current_link }}"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            force: true

        - name: "[Stage 4 Block] Ensure bin points to faulty candidate"
          ansible.builtin.file:
            src: "{{ app_current_link }}/{{ app_name }}.war"
            dest: "{{ target_artifact_path }}"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            force: true

        - name: "[Stage 4 Block] Attempt to restart service on candidate release"
          ansible.builtin.systemd:
            name: "{{ service_name }}"
            state: restarted

        - name: "[Stage 4 Block] Probe health check with short timeout (expected to fail)"
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ app_port }}/actuator/health"
            method: GET
            status_code: 200
            timeout: 3
          register: candidate_health
          retries: 2
          delay: 2
          until: candidate_health.status == 200

      rescue:
        - name: "[Stage 4 Rescue] Health check failure detected! Triggering Automated Recovery..."
          ansible.builtin.debug:
            msg: "CRITICAL: Fault detected in candidate release v1.2.0-canary. Autonomous self-healing recovery initiated!"

        - name: "[Stage 4 Rescue] Automatically revert current symlink to previous stable release (v1.0.0)"
          ansible.builtin.file:
            src: "{{ app_releases_dir }}/v1.0.0"
            dest: "{{ app_current_link }}"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            force: true

        - name: "[Stage 4 Rescue] Restore bin WAR symlink to stable release"
          ansible.builtin.file:
            src: "{{ app_current_link }}/{{ app_name }}.war"
            dest: "{{ target_artifact_path }}"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            force: true

        - name: "[Stage 4 Rescue] Restart service with stable release"
          ansible.builtin.systemd:
            name: "{{ service_name }}"
            state: restarted

        - name: "[Stage 4 Rescue] Wait for restored service port"
          ansible.builtin.wait_for:
            host: "127.0.0.1"
            port: "{{ app_port }}"
            state: started
            timeout: 90
            delay: 5

        - name: "[Stage 4 Rescue] Verify Actuator health after automated recovery"
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ app_port }}/actuator/health"
            method: GET
            status_code: 200
            return_content: true
          register: recovery_health
          retries: 10
          delay: 3
          until: recovery_health.status == 200

        - name: "[Stage 4 Rescue] Assert service successfully self-healed"
          ansible.builtin.assert:
            that:
              - "'UP' in recovery_health.content"
            success_msg: "Stage 4 Passed: Autonomous self-healing recovery restored service to UP state!"

        - name: "[Stage 4 Rescue] Log automated self-healing recovery event"
          ansible.builtin.lineinfile:
            path: "{{ app_rollback_log }}"
            create: true
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0640"
            line: "[{{ ansible_date_time.iso8601 }}] AUTONOMOUS RECOVERY SUCCESSFUL: Candidate v1.2.0-canary failed healthcheck; automatically restored v1.0.0 | Actuator: UP"

    # --------------------------------------------------------------------------
    # FINAL RECAP
    # --------------------------------------------------------------------------
    - name: Display complete reliability and recovery validation report
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "RELIABILITY & RECOVERY VALIDATION SUITE: 100% PASSED"
          - "Stage 1 (Baseline Verification): PASSED (v1.0.0 UP)"
          - "Stage 2 (Version Upgrade): PASSED (v1.1.0 UP)"
          - "Stage 3 (Operator Rollback): PASSED (reverted to v1.0.0 UP)"
          - "Stage 4 (Self-Healing Auto-Rollback): PASSED (restored v1.0.0 UP)"
          - "Audit Log: {{ app_rollback_log }}"
          - "=========================================================="
