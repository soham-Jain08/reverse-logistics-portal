<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body text-center p-5">
      <h1 class="h3" th:text="${appName}">App name</h1>
      <p class="text-muted">Raise and track product return requests.</p>
      <a class="btn btn-primary me-2" th:href="@{/returns/new}">New return request</a>

      <a class="btn btn-outline-secondary" th:href="@{/actuator/health}">Check health</a>
    </div>
  </div>
</div>
</body>
</html>
