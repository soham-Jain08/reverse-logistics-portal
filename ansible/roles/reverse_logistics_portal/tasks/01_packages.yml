---
# ==============================================================================
# Task: 01_packages - Server Packages & Dependencies
# ==============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install required server packages (Java 17, utilities, system diagnostics)
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Verify OpenJDK 17 installation
  ansible.builtin.command: java -version
  register: java_version_output
  changed_when: false

- name: Display detected Java version
  ansible.builtin.debug:
    msg: "{{ java_version_output.stderr_lines | default(java_version_output.stdout_lines) }}"
