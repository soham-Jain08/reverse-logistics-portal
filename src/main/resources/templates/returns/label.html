<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Return Label')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-3">
  <div class="text-center no-print">
    <button type="button" class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print label</button>
    <a class="btn btn-outline-secondary" th:href="@{/returns/{id}(id=${r.id})}">Back to request</a>
  </div>

  <div class="label-sheet">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div class="label-small">Return authorisation</div>
        <div class="label-code" th:text="${r.returnCode}">RR-00001</div>
      </div>
      <div class="text-end">
        <canvas id="qrCanvas" width="100" height="100"></canvas>
      </div>
    </div>

    <div class="label-section">
      <div class="row">
        <div class="col-6">
          <div class="label-small">Order number</div>
          <div class="fw-bold" th:text="${r.orderNumber}">ORD-1001</div>
        </div>
        <div class="col-6">
          <div class="label-small">Pickup date</div>
          <div class="fw-bold" th:text="${r.pickupDate != null ? #temporals.format(r.pickupDate, 'dd MMM yyyy') : 'Pending'}">Pending</div>
        </div>
      </div>
    </div>

    <div class="label-section">
      <div class="label-small">Product</div>
      <div class="fw-bold" th:text="${r.productName}">Wireless Mouse</div>
      <div class="text-muted" th:text="'Qty: ' + ${r.quantity}">Qty: 1</div>
    </div>

    <div class="label-section">
      <div class="label-small">Pickup address</div>
      <div th:text="${r.customerName}">Asha Patil</div>
      <div th:text="${r.pickupAddress}">Address here</div>
    </div>

    <div class="label-section small text-muted">
      Stick this label on the outside of your package. The courier will scan it at pickup.
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script th:src="@{/js/label.js}"></script>
</body>
</html>
